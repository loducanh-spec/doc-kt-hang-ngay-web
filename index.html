<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Đọc KT Hằng Ngày</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Đọc KT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4a3427">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="plan.css">
<style>#bSearch,#bMarks,#rowDrive,.tab[data-tab=marks],.row:has(#bExport){display:none!important}</style>
<style>
/* VOICE: yên tĩnh, như cầm một cuốn sách in cũ
   IDEA: trang sách giấy thật, lật cong như Moon Reader
   PICTURE: chính trang đọc chiếm toàn màn hình
   COLOUR and TYPE: theme B "Óc chó & Đất nung", 4 nền (sáng, sepia, nâu tối, đen); Literata mặc định cho chữ (chọn thêm Noto Serif, Lora, Be Vietnam Pro), Be Vietnam Pro cho giao diện
   LAYOUT: trang đọc toàn màn, thanh trạng thái nhỏ ở đáy, menu nổi khi chạm giữa */
:root{--bg:#1c1411;--page:#221915;--ink:#ecdccf;--mute:#a8917f;--ui:#1a130f;--ui2:#2e221c;--uiInk:#f3e8df;--acc:#e08a62;--onAcc:#1a110c;--line:#3b2c24;--hlA:.32;
  --fs:21px;--lh:1.6;--serif:'Literata','Noto Serif',Georgia,serif;--sans:'Be Vietnam Pro',system-ui,sans-serif}
:root[data-t=black]{--bg:#000;--page:#000;--ink:#ede3db;--mute:#9b8d84;--ui:#0e0c0b;--ui2:#221e1b;--uiInk:#f1e9e2;--acc:#e08a62;--onAcc:#1a110c;--line:#2a2420}
:root[data-t=light]{--bg:#f3ece5;--page:#faf6f2;--ink:#2b211c;--mute:#6f5d52;--ui:#fffdfb;--ui2:#f1e8df;--uiInk:#2b211c;--acc:#a3452a;--onAcc:#fff;--line:#e9ddd2;--hlA:.45}
:root[data-t=sepia]{--bg:#e8d6be;--page:#efdfcb;--ink:#3a2a20;--mute:#6a5142;--ui:#f6ead9;--ui2:#e6d2b9;--uiInk:#3a2a20;--acc:#8f3c20;--onAcc:#fff;--line:#dcc5aa;--hlA:.45}
:root[data-f=noto]{--serif:'Noto Serif',Georgia,serif}:root[data-f=lora]{--serif:'Lora','Noto Serif',Georgia,serif}:root[data-f=bvp]{--serif:'Be Vietnam Pro',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#bookWrap{position:absolute;inset:0;isolation:isolate;z-index:0}
.pg{position:absolute;inset:0;background:var(--page);color:var(--ink);overflow:hidden;contain:strict}
#pgU{z-index:1}#shU{z-index:2}#pgT{z-index:3}#shT{z-index:4}#flap{z-index:5}
.shd{position:absolute;top:0;bottom:0;left:0;width:40px;pointer-events:none;display:none;will-change:transform,opacity}
#shU{background:linear-gradient(to right,rgba(0,0,0,.45),rgba(0,0,0,0))}
#shT{background:linear-gradient(to right,rgba(0,0,0,0),rgba(0,0,0,.35))}
#flap{position:absolute;top:0;bottom:0;left:0;width:100%;display:none;pointer-events:none;transform-origin:0 0;will-change:transform;
  background:linear-gradient(to right,color-mix(in srgb,var(--page) 88%,#000) 0%,color-mix(in srgb,var(--page) 92%,#fff) 55%,color-mix(in srgb,var(--page) 80%,#fff) 90%,color-mix(in srgb,var(--page) 70%,#000) 100%)}
.clip{position:absolute;left:22px;top:12px;overflow:hidden}
.flow,.measure{font-family:var(--serif),'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','PingFang SC','Noto Serif SC','Noto Sans SC','Microsoft YaHei',serif;font-size:var(--fs);line-height:var(--lhpx,var(--lh));text-align:justify;hyphens:none;overflow-wrap:break-word}
.measure{position:absolute;left:-9999px;top:0;visibility:hidden;overflow:hidden;column-gap:44px;column-fill:auto}.measure i{font-style:normal}
.clip{contain:strict}
.txt.cont{text-align-last:justify}.per.cont{text-align-last:auto}.per.cont .v:last-child{text-align-last:justify}
.chh{break-inside:avoid;text-align:center;margin:.2em 0 .9em}
.chh .bk{display:block;font-family:var(--sans);font-size:.56em;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.chh .cn{display:block;font-size:2.3em;line-height:1.1;font-weight:600;color:var(--acc)}
.txt{margin:0}
.v sup{font-size:.56em;font-weight:600;color:var(--acc);margin:0 .18em 0 .1em;font-family:var(--sans);vertical-align:.55em;line-height:0}
.per .v{display:block;margin-bottom:.35em}
.v.hy{background:rgb(233 198 64/var(--hlA))}.v.hg{background:rgb(125 187 106/var(--hlA))}.v.hb{background:rgb(106 159 219/var(--hlA))}.v.hp{background:rgb(224 127 162/var(--hlA))}.v.hv{background:rgb(165 139 216/var(--hlA))}
.v.sel{text-decoration:underline dotted var(--acc) 2px;text-underline-offset:.22em}
.v.flash{animation:fl 2.2s ease-out}
.v.say{background:color-mix(in srgb,var(--acc) 24%,transparent)}
@keyframes fl{0%,40%{background:color-mix(in srgb,var(--acc) 40%,transparent)}100%{background:transparent}}
.v .nt{font-size:.6em;vertical-align:.5em;color:var(--acc);margin-left:.15em}
/* iPhone mở từ màn hình chính: kéo thanh dưới xuống sát vạch Home, bỏ khoảng trống thừa */
html.iosapp,html.iosapp body{background:var(--page)}
html.iosapp #app{background:var(--page);padding-bottom:max(calc(env(safe-area-inset-bottom,0px) - 24px),10px)}
html.iosapp #status{background:var(--page)}
/* iPhone mở từ màn hình chính: thanh trạng thái luôn hiện và iOS phủ một dải mờ dưới nó, nên chừa vùng an toàn + 10px */
html.iosapp #app,html.iosapp.full #app{padding-top:calc(max(env(safe-area-inset-top,0px),20px) + 10px)}
html.iosapp .sheet:not(.on){box-shadow:none}
html.iosapp #status,html.iosapp #status button{height:30px}
#status{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;color:var(--mute);background:var(--bg)}
#status button{height:40px;padding:0 8px;display:flex;align-items:center}#stMenu{color:var(--ink)}#stMid{gap:6px}#stBook{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);color:var(--mute);font-size:18px}
/* menu */
#bar{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .18s}
#bar.on{opacity:1}#bar.on>*{pointer-events:auto}
.top,.bot{position:absolute;left:0;right:0;background:var(--ui);color:var(--uiInk);display:flex;align-items:center;gap:4px;padding:8px 10px;box-shadow:0 0 18px rgba(0,0,0,.35)}
.top{top:0;padding-top:calc(10px + var(--sbh,0px))}.bot{bottom:0}
html.full{--sbh:30px}

.ib{width:46px;height:46px;border-radius:23px;display:grid;place-items:center}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{flex:1;height:46px;border-radius:23px;background:var(--ui2);font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.pill b{flex:1;text-align:center;font-weight:600}
/* panels */
.panel{position:absolute;inset:0;background:var(--ui);color:var(--uiInk);display:none;flex-direction:column;z-index:20}
/* Bảng phủ cả vùng thanh trạng thái (inset:0 không tính padding của #app), nên tự chừa vùng an toàn phía trên */
.panel{padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))}
html.iosapp .panel{padding-top:calc(max(env(safe-area-inset-top,0px),20px) + 10px)}
html.full:not(.iosapp) .panel{padding-top:var(--sbh)}
.panel.on{display:flex}
.ph{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;min-height:60px}
.ph h2{margin:0;font-size:24px;font-weight:600;flex:1}
.tabs{display:flex;gap:6px;padding:4px 16px 10px}
.about{padding:4px 18px 24px;line-height:1.55;font-size:15px}.about h3{font-size:22px;margin:6px 0 2px;font-family:var(--serif,serif)}
.about .ver{color:var(--acc);font-weight:600;margin:0 0 14px}.about dl{margin:0}.about dt{font-size:12px;color:var(--mute);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.about dd{margin:0}.about small{color:var(--mute)}
.tab{height:38px;padding:0 13px;border-radius:10px;background:var(--ui2);font-size:15px}
.tab.on{background:var(--acc);color:var(--onAcc);font-weight:600}
.pb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.sec{padding:14px 20px 6px;font-size:13px;color:var(--mute);font-weight:600}
.bkRow{display:block;width:100%;text-align:left;padding:15px 20px;font-size:21px}
.bkRow.cur{background:var(--ui2)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:8px 20px 16px}
.grid button{height:54px;border-radius:12px;background:var(--ui2);font-weight:600;font-size:19px}
.grid button.cur{background:var(--acc);color:var(--onAcc)}
.grid button.vl{font-size:15px}.grid button.vx{opacity:.3}
.vhead{display:flex;align-items:center;gap:10px;padding:10px 20px 2px}.vhead b{font-size:17px;font-weight:600}.vhead span{margin-left:auto;font-size:13px;color:var(--mute)}
.vback{display:flex;align-items:center;gap:2px;height:40px;padding:0 12px 0 6px;border-radius:10px;background:var(--ui2);font-size:15px}
.vback svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.recent{border-top:1px solid var(--line);padding:10px 0 12px}
.recent h3{margin:0 20px 8px;font-size:17px}
.cards{display:flex;gap:10px;overflow-x:auto;padding:0 20px}
.card{flex:none;width:170px;text-align:left;background:var(--ui2);border-radius:16px;padding:12px 14px}
.card b{display:block;font-size:17px}.card small{color:var(--mute);font-size:13px}
.li{display:flex;align-items:center;width:100%;text-align:left;padding:13px 20px;gap:12px;border-bottom:1px solid var(--line)}
.li b{font-weight:600;font-size:17px}.li span{flex:1;color:var(--mute);font-size:13px;text-align:right}
.mf{padding:4px 16px 10px}.chip .cdot{margin-right:6px}
.cdot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;vertical-align:-1px}
.mk{display:block;width:100%;text-align:left;padding:12px 20px;border-bottom:1px solid var(--line)}
.mkH{display:flex;align-items:center;gap:8px;margin-bottom:4px}.mkH b{font-size:15px;font-weight:600;color:var(--acc)}.mkH small{margin-left:auto;color:var(--mute);font-size:12px;white-space:nowrap}
.mkT{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--serif);font-size:16px;line-height:1.5}
.mkT sup{font-size:.62em;color:var(--mute);margin-right:2px}
.mkN{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;font-size:14px;color:var(--mute);font-style:italic}
.tabs{overflow-x:auto}.tab{white-space:nowrap}
/* Tab Mục lục: 4 ô đều nhau, biểu tượng trên chữ dưới, bo góc vừa phải, chữ không bao giờ tràn */
.tocTabs{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;overflow:visible!important}
.tocTabs .tab{height:auto;min-height:54px;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12.5px;line-height:1.15;white-space:normal;text-align:center;overflow:hidden}
.tocTabs .tab svg{width:21px;height:21px;flex:none}.tocTabs .tab span{display:block;max-width:100%;overflow-wrap:anywhere}
.empty{padding:30px 20px;color:var(--mute);text-align:center}
/* search */
.sbox{display:flex;gap:8px;padding:0 16px 10px}
.sbox input{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--ui2);color:var(--uiInk);padding:0 18px;font-size:16px;font-family:var(--sans);outline:none}
.sbox input:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 20px 12px}
.chip{flex:none;height:36px;padding:0 14px;border-radius:10px;background:var(--ui2);font-size:15px;white-space:nowrap}
.res{display:block;width:100%;text-align:left;padding:12px 20px;border-bottom:1px solid var(--line)}
.res b{font-size:14px;color:var(--acc);font-weight:600}.res p{margin:3px 0 0;font-family:var(--serif);font-size:16px;line-height:1.5}
.res mark{background:color-mix(in srgb,var(--acc) 30%,transparent);color:inherit;border-radius:2px}
.scope{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 16px 10px}
.scope .chip{height:40px;padding:0 8px;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.scope .chip.wide{grid-column:1/-1}
/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ui);color:var(--uiInk);border-radius:20px 20px 0 0;padding:14px 16px calc(14px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));max-height:85%;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.4);transform:translateY(105%);transition:transform .22s;z-index:30}
.sheet.on{transform:none}
.row{margin:0 0 12px}.row[hidden]{display:none}
.row label{display:block;font-size:13px;color:var(--mute);margin:0 0 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.btn{height:44px;padding:0 10px;border-radius:12px;background:var(--ui2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.btn.pri{background:var(--acc);color:var(--onAcc);font-weight:600}.btn.sm{height:36px;padding:0 16px}
.seg .btn.on{background:var(--acc);color:var(--onAcc);font-weight:600}
.val{display:grid;place-items:center;font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:12px}
.acct input{display:block;width:100%;height:44px;margin:0 0 8px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--ui2);color:var(--uiInk);font-size:16px;font-family:inherit}
.acct .seg{margin:0 0 8px}.acct a{color:var(--acc);font-size:14px;text-decoration:underline;cursor:pointer}
.drvSt{font-size:14px;line-height:1.45;margin:0 0 8px;color:var(--uiInk);overflow-wrap:anywhere}
.vbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
#voiceSel{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--ui2);color:var(--uiInk);font:15px var(--sans);padding:0 10px;min-width:0}
.vhint{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.45}
.fontSeg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.fontSeg .btn{font-size:17px}.fontSeg .btn.on{background:var(--acc);color:var(--onAcc)}
.setHead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.setHead b{font-size:17px}
.selTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.selTop b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selRow{display:flex;align-items:center;gap:5px}
.dot{flex:0 1 36px;width:36px;height:auto;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;padding:0}
.dot.none{background:var(--ui2)}
.sep{flex:1 1 2px}
.ic{flex:none;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--ui2)}
.selTop .ic{background:none;width:36px;height:36px}.selRow .ic{width:36px;height:36px}
.ic svg,.dot svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#selNoteBtn.has{background:var(--acc);color:var(--onAcc)}
#noteBox{margin-top:10px;display:grid;gap:8px}#noteBox[hidden]{display:none}
textarea{width:100%;min-height:64px;border-radius:8px;border:1px solid var(--line);background:var(--ui2);color:var(--uiInk);padding:10px;font:16px var(--sans);resize:vertical}
#toast{position:absolute;z-index:60;left:50%;bottom:60px;transform:translateX(-50%);background:var(--uiInk);color:var(--ui);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:88%;text-align:center}
#toast.on{opacity:1}
#ttsBar{position:absolute;left:10px;right:10px;bottom:10px;display:none;z-index:15;background:var(--ui);color:var(--uiInk);border-radius:18px;padding:6px 8px 8px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#ttsBar.on{display:block}
.tRef{display:flex;align-items:center;justify-content:space-between;padding:0 4px 2px 8px;font-size:14px;font-weight:600}
.tRef .tx{width:36px;height:36px;display:grid;place-items:center}
.tBtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;gap:4px}
.tBtns button{height:58px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tBtns small{font-size:10.5px;line-height:1.15;text-align:center;color:var(--mute);white-space:nowrap}
.tBtns .big{height:56px;width:56px;justify-self:center;border-radius:50%;background:var(--acc);color:var(--onAcc)}
#ttsBar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#ttsBar .big svg{fill:currentColor;stroke:none;width:24px;height:24px}
#bar .fsBar{position:absolute;left:12px;right:12px;bottom:74px;background:var(--ui);color:var(--uiInk);border-radius:30px;display:flex;align-items:center;gap:6px;padding:4px 8px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.fsBar input{flex:1;height:44px;accent-color:var(--acc)}.fsBar b{min-width:30px;text-align:center;font-size:16px}
.aS{font-family:var(--serif);font-size:15px;font-weight:700}.aL{font-family:var(--serif);font-size:25px;font-weight:700}
html.full #app{padding-top:0;padding-bottom:0}
@media (prefers-reduced-motion:reduce){.sheet,#bar{transition:none}}
select.lsel{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--ui2);color:var(--uiInk);font:16px var(--sans);padding:0 10px}
em.s2{font-style:normal;color:var(--mute);font-size:.9em}
b.lt{font-family:var(--sans);font-size:.5em;font-weight:700;letter-spacing:.04em;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);border-radius:4px;padding:0 .3em;margin-right:.25em;vertical-align:.25em;line-height:1}
/* Cách đọc: cuộn dọc liền mạch */
#scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--page);color:var(--ink);display:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;z-index:1}
html.scroll #scr{display:block}html.scroll #bookWrap{display:none}
#scr .flow{padding:12px 22px 0}#scr .sch{padding-bottom:1.6em}#scr .sch+.sch{border-top:1px solid var(--line);padding-top:1.2em}
#scr .scEnd{height:40vh}
.lchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lchip{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--ui2);font-size:14px;text-align:left;min-height:44px}
.lchip i{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--mute);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700}
.lchip.on i{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.lchip small{margin-left:auto;color:var(--mute);font-size:12px}

</style>

<script src="capacitor.js"></script>
<script>
{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem('dkt.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('dkt.'+k,JSON.stringify(v))}catch(e){}}};
let B=[], chList=[];                     // B[b]=[name,id,chapters]; chList = flat [b,c]
const set=Object.assign({t:'brown',ff:'literata',fs:21,lh:1.6,per:0,rate:1,full:0,voice:'',lang:'vi',lang2:'',mode:'page',lab:1},store.get('set',{}));
if(!Array.isArray(set.langs))set.langs=[set.lang||'vi'].concat(set.lang2&&set.lang2!==set.lang?[set.lang2]:[]);set.lang=set.langs[0];
/* Ngôn ngữ: VB = bản 1925 (luôn tải, dùng cho kế hoạch và ảnh báo cáo); B = bản đang đọc; B2 = bản song ngữ */
const LANGS={vi:{f:'vie1925.json',tts:'vi-VN',n:'Tiếng Việt',lb:'VI'},en:{f:'kjv.json',tts:'en-US',n:'English',lb:'EN'},ko:{f:'krv1961.json',tts:'ko-KR',n:'한국어',lb:'한'},zh:{f:'cuvs1919.json',tts:'zh-CN',n:'中文简体',lb:'中'},fr:{f:'lsg1910.json',tts:'fr-FR',n:'Français',lb:'FR'}};
/* BX = các bản hiện thêm dưới mỗi câu (ngôn ngữ số 2..4): [{code,d}] */
const LDATA={};let VB=null,BX=[];
function loadLang(code){if(LDATA[code])return Promise.resolve(LDATA[code]);return fetch(LANGS[code].f).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>LDATA[code]=d)}
const CAP=window.capacitorExports, NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const P=n=>NATIVE&&CAP?CAP.registerPlugin(n):null;
const TTS=P('TextToSpeech'), RA=P('ReadAloud'), AppP=P('App'), FS=P('Filesystem'), ShareP=P('Share');
let pos=store.get('pos',{b:0,c:0,v:1});  // mặc định Sáng-thế Ký 1
let hl=store.get('hl',{});               // "b.c.v" -> {c:'hy',n:'...',t:thời điểm sửa}
let tomb=store.get('tomb',{});           // "b.c.v" -> thời điểm xóa (để đồng bộ việc xóa sang máy khác)
let hist=store.get('hist',[]), searches=store.get('searches',[]);
let pages=[], win=[];

const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),m.length>40?4500:1800)};
const ref=(b,c,v)=>B[b][0]+' '+(c+1)+(v?':'+v:'');
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const chIdx=(b,c)=>{let n=0;for(let i=0;i<b;i++)n+=B[i][2].length;return n+c};

function applySettings(){
  document.documentElement.dataset.t=set.t;
  document.documentElement.dataset.f=set.ff;
  document.documentElement.classList.toggle('scroll',set.mode==='scroll');
  $$('#segFont .btn').forEach(x=>x.classList.toggle('on',x.dataset.v===set.ff));
  {const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue('--page').trim()}
  document.documentElement.style.setProperty('--fs',set.fs+'px');
  document.documentElement.style.setProperty('--lh',set.lh);
  $$('#segTheme .btn').forEach(x=>x.classList.toggle('on',x.dataset.v===set.t));
  $$('#segPer .btn').forEach(x=>x.classList.toggle('on',+x.dataset.v===set.per));
  $$('#segRate .btn').forEach(x=>x.classList.toggle('on',+x.dataset.v===set.rate));
  $$('#segFull .btn').forEach(x=>x.classList.toggle('on',+x.dataset.v===set.full));
  if(NATIVE&&CAP&&CAP.SystemBars){try{CAP.SystemBars.setStyle({style:(set.t==='light'||set.t==='sepia')?'LIGHT':'DARK'})}catch(e){}}
  if($('#fsRange')){$('#fsRange').value=set.fs;$('#fsVal').textContent=set.fs}
  if($('#fsShow')){$('#fsShow').textContent=set.fs;$('#lhShow').textContent=set.lh.toFixed(1)}
  store.set('set',set);
}

/* ---------- Dàn trang ---------- */
const head=(b,c)=>`<div class="chh"><span class="bk">${esc(B[b][0])}</span><span class="cn">${c+1}</span></div>`;
// Lề trên/dưới 12px (~2mm). Khoảng cách dòng được nới nhẹ để số dòng lấp kín đúng chiều cao trang, không bỏ trống phần dư.
function geom(){const st=$('#stage');const W=st.clientWidth,H=st.clientHeight,ch=H-24;
  const base=set.fs*set.lh,n=Math.max(1,Math.floor(ch/base)),lh=Math.floor(ch/n*100)/100;
  document.documentElement.style.setProperty('--lhpx',lh+'px');
  return{W,H,cw:W-44,ch,G:44}}
// Đo một lần bằng bố cục nhiều cột (mỗi cột = 1 trang), rồi cắt thành từng trang chỉ chứa đúng chữ của trang đó.
// Trang nhẹ => lật mượt, không phải vẽ lại cả chương mỗi khung hình.
// Dữ liệu câu: chuỗi = nội dung; '' = câu đã gộp vào câu trước (vd 14-16); null = câu không có trong bản Thánh Kinh Hội.
const vtext=(b,c,v)=>B[b][2][c][v-1]||'';
function vlabel(b,c,v){const vs=B[b][2][c];let e=v;while(vs[e]==='')e++;return e>v?v+'-'+e:''+v}
/* Tách từ của một đoạn, gồm bản chính và các bản hiện thêm.
   Mỗi từ là [chữ, cờ, liền trước]: cờ 0 bản chính | 1 bản phụ | 2 xuống dòng | 3 nhãn ngôn ngữ.
   Chữ Hán không có dấu cách nên tách từng chữ, liền trước = 1: không chèn dấu cách. */
const CJK=/[\u3000-\u303f\u3400-\u9fff\uf900-\ufaff\uff00-\uffef]/;
const tk=(txt,f)=>{const o=[];(txt||'').split(' ').filter(Boolean).forEach(w=>{if(CJK.test(w))[...w].forEach((ch,j)=>o.push([ch,f,j?1:0]));else o.push([w,f,0])});return o};
function chWords(b,c){
  const vs=B[b][2][c],xs=BX.map(x=>({lb:LANGS[x.code].lb,v:x.d[b]&&x.d[b][2][c]||[]}));
  const nv=Math.max(vs.length,...xs.map(x=>x.v.length));
  return Array.from({length:nv},(_,i)=>{let a=tk(vs[i],0);
    xs.forEach(x=>{const t2=x.v[i];if(!t2)return;const bb=tk(t2,1);if(set.lab)bb.unshift([x.lb,3,0]);a=a.concat(a.length?[['',2]]:[],bb)});return a});
}
const rt=t=>t[1]===3?'<b class="lt">'+esc(t[0])+'</b>':t[1]?'<em class="s2">'+esc(t[0])+'</em>':esc(t[0]);
const jn=(ts,f)=>ts.map((t,j)=>(j&&!t[2]&&t[1]!==2&&ts[j-1][1]!==2?' ':'')+f(t)).join('');
function measure(b,c,g){
  const m=document.createElement('div');m.className='measure';
  Object.assign(m.style,{width:g.cw+'px',height:g.ch+'px',columnWidth:g.cw+'px'});
  const words=chWords(b,c);
  const tok=t=>t[1]===2?'<br>':`<i>${rt(t)}</i>`;
  m.innerHTML=head(b,c)+`<p class="txt${set.per||BX.length?' per':''}">`+words.map((ws,i)=>ws.length?
    `<span class="v"><sup>${vlabel(b,c,i+1)}</sup>`+jn(ws,tok)+' </span>':'').join('')+'</p>';
  document.body.appendChild(m);
  const left=m.getBoundingClientRect().left, step=g.cw+g.G;
  const col=el=>{const r=el.getClientRects()[0];return r?Math.max(0,Math.floor((r.left-left+2)/step)):0};
  const hp=col(m.firstChild), spans=m.querySelectorAll('.v'), wp=[];
  let si=0;words.forEach(ws=>{if(!ws.length){wp.push([]);return}const is=[...spans[si++].getElementsByTagName('i')].map(col);let q=0;
    /* dấu xuống dòng nằm cùng trang với từ kế tiếp */
    const pos=ws.map(t=>t[1]===2?null:is[q++]);for(let j=pos.length-1;j>=0;j--)if(pos[j]===null)pos[j]=j+1<pos.length?pos[j+1]:(j?pos[j-1]:0);wp.push(pos)});
  m.remove();
  const n=Math.max(1,hp+1,...wp.map(a=>a.length?a[a.length-1]+1:1));
  const parts=Array.from({length:n},()=>[]), vp=[0];
  words.forEach((ws,i)=>{const v=i+1,k=b+'.'+c+'.'+v,h=hl[k],cls='v'+(h&&h.c?' '+h.c:'');
    vp.push(wp[i].length?wp[i][0]:vp[vp.length-1]);
    let p0=-1,buf=[];
    const flush=(p,last)=>{if(p<0)return;const first=p===(wp[i][0]||0);
      const txt=jn(buf,t=>t[1]===2?'<br>':rt(t));
      parts[p].push({html:`<span class="${cls}" data-k="${k}" data-v="${v}"${last?' data-e="1"':''}>${first?`<sup>${vlabel(b,c,v)}</sup>`:''}${txt}${last&&h&&h.n?'<span class="nt">✎</span>':''} </span>`,cont:!last})};
    ws.forEach((w,j)=>{const p=wp[i][j];if(p!==p0){flush(p0,false);buf=[];p0=p}buf.push(w)});
    flush(p0,true);});
  const html=parts.map((ps,p)=>{const cont=ps.length&&ps[ps.length-1].cont;
    return (p===hp?head(b,c):'')+`<p class="txt${set.per||BX.length?' per':''}${cont?' cont':''}">${ps.map(x=>x.html).join('')}</p>`});
  return{n,vp,html};
}
/* ---------- Bộ lật trang tự viết ----------
   3 lớp: U (trang nằm dưới), T (trang đang lật, cắt theo nếp gấp), F (mặt sau tờ giấy, luôn đục).
   Nếp gấp f chạy theo ngón tay. Mọi lớp đều có nền đục nên không bao giờ thấy chữ hai trang đè nhau. */
const stage=$('#stage');
let idx=0, G=null, anim=null, drag=null, sayK=null;
const pgT=$('#pgT'), pgU=$('#pgU'), flap=$('#flap'), shU=$('#shU'), shT=$('#shT');
function decorate(el){el.querySelectorAll('.v').forEach(v=>{const k=v.dataset.k,h=hl[k];
  v.className='v'+(h&&h.c?' '+h.c:'')+(sel.has(k)?' sel':'')+(k===sayK?' say':'');
  const nt=v.querySelector('.nt');if(h&&h.n&&v.dataset.e&&!nt)v.insertAdjacentHTML('beforeend','<span class="nt">✎</span>');if(!(h&&h.n)&&nt)nt.remove()})}
function render(el,i){el.innerHTML=`<div class="clip" style="width:${G.cw}px;height:${G.ch}px"><div class="flow">${pages[i]}</div></div>`;decorate(el)}
function makeWin(b,c){
  const ci=chIdx(b,c), list=[];
  if(ci>0)list.push(chList[ci-1]);list.push([b,c]);if(ci<chList.length-1)list.push(chList[ci+1]);
  win=[];pages=[];
  for(const [bb,cc] of list){const m=measure(bb,cc,G);win.push({b:bb,c:cc,start:pages.length,n:m.n,vp:m.vp});pages.push(...m.html)}
  return win.find(w=>w.b===b&&w.c===c);
}
function build(b,c,anchor){   // anchor: {v} hoặc {page:'last'}
  if(set.mode==='scroll'){G=geom();scrBuild(b,c,anchor);return}
  stopAnim();G=geom();const cur=makeWin(b,c);
  idx=cur.start;
  if(anchor&&anchor.page==='last')idx=cur.start+cur.n-1;
  else if(anchor&&anchor.v)idx=cur.start+(cur.vp[anchor.v]||0);
  pos.b=b;pos.c=c;showIdle();afterMove();
}
function showIdle(){render(pgT,idx);pgT.style.clipPath='none';pgU.style.display='none';flap.style.display=shU.style.display=shT.style.display='none'}
function winOf(p){return win.find(w=>p>=w.start&&p<w.start+w.n)}
function firstVerse(w,ip){let v=1;for(let i=1;i<w.vp.length;i++){if(w.vp[i]===ip)return i;if(w.vp[i]<ip)v=i}return v}
function settle(){ // sau khi lật: nếu đã sang chương khác thì dựng lại cửa sổ 3 chương quanh chương mới (không hiện ra)
  const w=winOf(idx);
  if(w.b!==pos.b||w.c!==pos.c){const ip=idx-w.start;G=geom();const cur=makeWin(w.b,w.c);idx=cur.start+ip;pos.b=w.b;pos.c=w.c;showIdle()}
  afterMove();
}
function afterMove(){
  if(set.mode==='scroll'){$('#stPage').textContent='câu '+pos.v+'/'+B[pos.b][2][pos.c].length}
  else{const w=winOf(idx), ip=idx-w.start;pos.v=firstVerse(w,ip);$('#stPage').textContent=(ip+1)+'/'+w.n}
  pos.t=Date.now();store.set('pos',pos);acctSoon();
  $('#stBook').textContent=ref(pos.b,pos.c);$('#bRef').textContent=ref(pos.b,pos.c);
  $('#stPct').textContent=Math.round(chIdx(pos.b,pos.c)/chList.length*1000)/10+'%';
  hist=hist.filter(h=>!(h.b===pos.b&&h.c===pos.c));hist.unshift({b:pos.b,c:pos.c,v:pos.v,t:Date.now()});hist=hist.slice(0,50);store.set('hist',hist);
  trackMove();
}
// vẽ nếp gấp tại f (0..W). T hiện [0,f]; mặt sau tờ giấy nằm ở [2f-W, f]; U lộ ra ở [f,W]
function drawFold(f){
  const W=G.W;f=Math.max(0,Math.min(W,f));const fw=W-f, p=fw/W; // p: 0 = chưa lật, 1 = lật xong
  pgT.style.clipPath=`inset(0 ${fw}px 0 0)`;
  flap.style.transform=`translate3d(${2*f-W}px,0,0) scaleX(${Math.max(fw,0.001)/W})`;
  const k=Math.sin(Math.PI*Math.min(1,p*1.1));
  shU.style.transform=`translate3d(${f}px,0,0)`;shU.style.opacity=k;
  shT.style.transform=`translate3d(${2*f-W-40}px,0,0)`;shT.style.opacity=k*.9;
}
function prep(dir){ // dir 1: sang trang sau, -1: về trang trước
  if(dir>0&&idx>=pages.length-1||dir<0&&idx<=0)return false;
  const ti=dir>0?idx:idx-1, ui=dir>0?idx+1:idx;
  render(pgT,ti);render(pgU,ui);pgU.style.display='';flap.style.display=shU.style.display=shT.style.display='block';
  drawFold(dir>0?G.W:0);return true;
}
function stopAnim(){if(anim){cancelAnimationFrame(anim.raf);anim=null}}
function animateTo(dir,from,to,done){
  stopAnim();const dist=Math.abs(to-from),dur=Math.max(140,Math.min(420,90+330*dist/G.W)),t0=performance.now();
  anim={dir};const tick=now=>{const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,3);drawFold(from+(to-from)*e);
    if(t<1)anim.raf=requestAnimationFrame(tick);else{anim=null;done()}};anim.raf=requestAnimationFrame(tick);
}
function finish(dir,ok){ // ok: lật xong; không thì trả về trang cũ
  if(ok)idx+=dir;showIdle();if(ok)settle();
}
function turn(dir){ // lật bằng lệnh (đọc thành tiếng, nút)
  if(set.mode==='scroll'){scr.scrollBy({top:dir*scr.clientHeight*.85,behavior:'smooth'});return}
  if(anim||drag)return;if(!prep(dir)){if(dir>0&&idx>=pages.length-1)endBible();return}
  const W=G.W;animateTo(dir,dir>0?W:0,dir>0?0:W,()=>finish(dir,true));
}
const go=(b,c,v)=>{closeAll();build(b,c,{v:v||1});if(v>1)$$(`#pgT .v[data-k="${b}.${c}.${v}"],#scr .v[data-k="${b}.${c}.${v}"]`).forEach(e=>e.classList.add('flash'))};
const step=d=>{const i=chIdx(pos.b,pos.c)+d;if(i<0||i>=chList.length)return;const [b,c]=chList[i];build(b,c,{v:1})};

/* ---------- Cuộn dọc liền mạch ----------
   Hiện vài đoạn liền nhau trong #scr; cuộn gần cuối thì nối đoạn sau, gần đầu thì chèn đoạn trước (giữ nguyên chỗ đang đọc).
   Đoạn hiện tại = đoạn chứa đường mốc ở 30% chiều cao màn hình; cuộn qua hết một đoạn sang đoạn kế tiếp thì afterMove() ghi nhận như lật trang. */
const scr=$('#scr');let scrBusy=false,scrEndT=0;
function scrHTML(b,c){const words=chWords(b,c);
  return `<section class="sch" data-b="${b}" data-c="${c}">${head(b,c)}<p class="txt${set.per||BX.length?' per':''}">`+words.map((ws,i)=>{if(!ws.length)return'';
    const v=i+1,k=b+'.'+c+'.'+v;return `<span class="v" data-k="${k}" data-v="${v}"><sup>${vlabel(b,c,v)}</sup>${jn(ws,t=>t[1]===2?'<br>':rt(t))} </span>`}).join('')+'</p></section>'}
const scrSecs=()=>[...scr.querySelectorAll('.sch')];
const secCi=el=>chIdx(+el.dataset.b,+el.dataset.c);
function scrBuild(b,c,anchor){
  scrBusy=true;const ci=chIdx(b,c);let h='';
  for(let i=Math.max(0,ci-1);i<=Math.min(chList.length-1,ci+1);i++)h+=scrHTML(...chList[i]);
  scr.innerHTML='<div class="flow">'+h+'</div>'+(ci>=chList.length-2?'<div class="scEnd"></div>':'');decorate(scr);
  const sec=scr.querySelector(`.sch[data-b="${b}"][data-c="${c}"]`);let y=sec.offsetTop;
  if(anchor&&anchor.page==='last')y=sec.offsetTop+sec.offsetHeight-scr.clientHeight;
  else if(anchor&&anchor.v>1){const el=sec.querySelector(`.v[data-v="${anchor.v}"]`);if(el)y=el.offsetTop-scr.clientHeight*.25}
  scr.scrollTop=Math.max(0,y);pos.b=b;pos.c=c;pos.v=anchor&&anchor.v||1;
  requestAnimationFrame(()=>{scrBusy=false;scrFill();scrPos(true)});
}
function scrFill(){ // giữ khoảng 1,5 màn hình chữ phía trên và phía dưới chỗ đang đọc
  const fl=scr.querySelector('.flow');if(!fl)return;let ss=scrSecs();const H=scr.clientHeight;
  for(let n=0;n<4&&scr.scrollHeight-scr.scrollTop-H<H*1.5;n++){const i=secCi(ss[ss.length-1])+1;if(i>=chList.length)break;
    fl.insertAdjacentHTML('beforeend',scrHTML(...chList[i]));decorate(fl.lastElementChild);ss=scrSecs();
    if(i>=chList.length-1&&!scr.querySelector('.scEnd'))scr.insertAdjacentHTML('beforeend','<div class="scEnd"></div>')}
  for(let n=0;n<4&&scr.scrollTop<H*1.5;n++){const i=secCi(ss[0])-1;if(i<0)break;
    const h0=scr.scrollHeight;fl.insertAdjacentHTML('afterbegin',scrHTML(...chList[i]));decorate(fl.firstElementChild);scr.scrollTop+=scr.scrollHeight-h0;ss=scrSecs()}
  // bỏ bớt đoạn ở xa để trang nhẹ
  while(ss.length>9){const t=scr.scrollTop,first=ss[0],last=ss[ss.length-1];
    if(first.offsetTop+first.offsetHeight<t-H*3){const h0=scr.scrollHeight;first.remove();scr.scrollTop-=h0-scr.scrollHeight}
    else if(last.offsetTop>t+H*4)last.remove();else break;ss=scrSecs()}
}
function scrPos(force){
  const ss=scrSecs();if(!ss.length)return;const line=scr.scrollTop+scr.clientHeight*.3;
  let sec=ss[0];for(const s of ss)if(s.offsetTop<=line)sec=s;
  const b=+sec.dataset.b,c=+sec.dataset.c;
  const top=scr.getBoundingClientRect().top+4;
  let v=1;for(const el of sec.querySelectorAll('.v'))if(el.getBoundingClientRect().bottom>top){v=+el.dataset.v;break}
  const ch=b!==pos.b||c!==pos.c,ci=chIdx(b,c),c0=chIdx(pos.b,pos.c);
  // cuộn nhanh qua đoạn rất ngắn (vd Thi-thiên 117): ghi nhận lần lượt từng đoạn đã cuộn qua
  if(ch&&!force&&ci>c0+1&&ci-c0<=4)for(let i=c0+1;i<ci;i++){[pos.b,pos.c]=chList[i];pos.v=1;afterMove()}
  if(ch||v!==pos.v||force){pos.b=b;pos.c=c;pos.v=v;if(ch||force)afterMove();else{$('#stPage').textContent='câu '+v+'/'+B[b][2][c].length;pos.t=Date.now();store.set('pos',pos)}}
  // cuộn tới cuối Khải-huyền 22
  if(chIdx(b,c)===chList.length-1&&scr.scrollTop+scr.clientHeight>=scr.scrollHeight-8&&Date.now()-scrEndT>4000){scrEndT=Date.now();endBible()}
}
let scrRaf=0;scr.addEventListener('scroll',()=>{if(scrBusy||scrRaf)return;scrRaf=requestAnimationFrame(()=>{scrRaf=0;scrFill();scrPos()})},{passive:true});
scr.addEventListener('click',()=>{if($('#bar').classList.contains('on')){$('#bar').classList.remove('on');return}if($('.sheet.on'))closeSheets()});
function scrShow(b,c,v){ // đọc thành tiếng: đưa câu đang đọc vào tầm nhìn
  let el=scr.querySelector(`.v[data-k="${b}.${c}.${v}"]`);if(!el){scrBuild(b,c,{v});return}
  const r=el.getBoundingClientRect(),R=scr.getBoundingClientRect();
  if(r.top<R.top+8||r.bottom>R.bottom-8)scr.scrollTo({top:el.offsetTop-scr.clientHeight*.25,behavior:'smooth'})}

/* ---------- Vuốt lật trang (mép giấy theo ngón tay), chạm chọn câu ---------- */
let down=null, lpTimer=null, longDone=false, sel=new Set(), ghostT=0, ghostXY=null;
const inUi=t=>t.closest('#bar .top,#bar .bot,#bar .fsBar,#ttsBar,.sheet');
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('pointerdown',e=>{
  if(inUi(e.target)||!G||set.mode==='scroll')return;
  down={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId,hist:[[e.clientX,performance.now()]]};longDone=false;clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{if(drag||!down)return;const v=verseAt(down.x,down.y);if(v){longDone=true;ghostT=Date.now()+400;ghostXY=[down.x,down.y];toggleSel(v,true)}},520);
});
stage.addEventListener('pointermove',e=>{
  if(!down||e.pointerId!==down.id)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;
  down.hist.push([e.clientX,performance.now()]);if(down.hist.length>6)down.hist.shift();
  if(Math.hypot(dx,dy)>10)clearTimeout(lpTimer);
  if(!drag&&!longDone&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){
    if(anim){ // đang chạy hiệu ứng: cho xong ngay rồi bắt đầu lần lật mới
      const a=anim;stopAnim();finish(a.dir,true)}
    const dir=dx<0?1:-1;
    if(!prep(dir)){if(dir>0&&idx>=pages.length-1)endBible();down=null;return}
    drag={dir,x0:e.clientX};try{stage.setPointerCapture(e.pointerId)}catch(_){}
    $('#bar').classList.remove('on');
  }
  if(drag){const W=G.W,d=e.clientX-drag.x0;drawFold(drag.dir>0?W+Math.min(0,d):Math.max(0,d))}
});
const endDrag=(e,cancel)=>{
  clearTimeout(lpTimer);const d=down;down=null;
  if(drag){const dr=drag;drag=null;const W=G.W,dx=e.clientX-dr.x0;
    const h=d.hist,v=h.length>1?(h[h.length-1][0]-h[0][0])/Math.max(1,h[h.length-1][1]-h[0][1]):0; // px/ms
    const f=dr.dir>0?W+Math.min(0,dx):Math.max(0,dx);
    const moved=dr.dir>0?W-f:f;
    const ok=!cancel&&(dr.dir>0?(moved>W*.22&&v<.25)||v<-.35:(moved>W*.22&&v>-.25)||v>.35);
    const to=dr.dir>0?(ok?0:W):(ok?W:0);
    animateTo(dr.dir,f,to,()=>finish(dr.dir,ok));return true}
  return false;
};
stage.addEventListener('pointercancel',e=>{if(down)endDrag(e,true)});
stage.addEventListener('pointerup',e=>{
  if(!down)return;const d=down;
  if(endDrag(e,false))return;
  const isTap=Math.hypot(e.clientX-d.x,e.clientY-d.y)<=10;
  if(longDone){ghostT=Date.now();ghostXY=[e.clientX,e.clientY]}
  if(longDone||!isTap||Date.now()-d.t>500||anim)return;
  if(inUi(e.target))return;
  if(e.pointerType!=='mouse'){ghostT=Date.now();ghostXY=[e.clientX,e.clientY]}
  // Chạm chỉ dùng để chọn câu. Lật trang chỉ bằng vuốt. Menu mở từ thanh dưới cùng.
  if($('#bar').classList.contains('on')){$('#bar').classList.remove('on');return}
  const v=verseAt(d.x,d.y);
  if(v){toggleSel(v);return}
  if(sel.size){clearSel();return}
  if($('.sheet.on'))closeSheets();
});
function verseAt(x,y){ // chạm vào khe giữa hai dòng: dò lên/xuống vài px để lấy câu gần nhất
  for(const d of [0,-6,6,-12,12,-18,18]){const el=document.elementFromPoint(x,y+d);const v=el&&el.closest('#pgT .v');if(v)return v.dataset.k}
  return null}

/* ---------- Chọn câu, tô màu, ghi chú ---------- */
function paint(k){const h=hl[k];$$(`.v[data-k="${k}"]`).forEach(el=>{el.classList.remove('hy','hg','hb','hp','hv');if(h&&h.c)el.classList.add(h.c);
  const nt=el.querySelector('.nt');if(h&&h.n&&!nt&&el.dataset.e)el.insertAdjacentHTML('beforeend','<span class="nt">✎</span>');if(!(h&&h.n)&&nt)nt.remove();
  el.classList.toggle('sel',sel.has(k))})}
function toggleSel(k,force){return; // chưa bật tô màu, ghi chú
  if(sel.has(k)&&!force)sel.delete(k);else sel.add(k);paint(k);
  if(!sel.size){closeSheets();return}
  const ks=[...sel].sort((a,b)=>+a.split('.')[2]-+b.split('.')[2]);const [b,c]=ks[0].split('.').map(Number);
  $('#selRef').textContent=ref(b,c,ks.map(k=>k.split('.')[2]).join(','));
  const nt0=sel.size===1&&hl[ks[0]]?hl[ks[0]].n||'':'';$('#selNote').value=nt0;$('#selNoteBtn').classList.toggle('has',!!nt0);if(!sel.has(k)||sel.size===1)$('#noteBox').hidden=true;
  openSheet('#shSel');}
function clearSel(){const ks=[...sel];sel.clear();ks.forEach(paint);closeSheets();$('#noteBox').hidden=true}
$('#selColors').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;
  for(const k of sel)setHl(k,{c:b.dataset.c});saveHl();clearSel();toast(b.dataset.c?'Đã tô màu':'Đã bỏ tô màu')});
$('#selNoteBtn').onclick=()=>{const nb=$('#noteBox');nb.hidden=!nb.hidden;if(!nb.hidden)setTimeout(()=>$('#selNote').focus(),50)};
function setHl(k,patch){const now=Date.now(),h=Object.assign({},hl[k]||{},patch);
  if(!h.c&&!h.n){if(hl[k]){delete hl[k];tomb[k]=now}}else{h.t=now;hl[k]=h;delete tomb[k]}}

/* Tìm kiếm nhiều từ:
   - Câu chứa đúng cả cụm từ được xếp lên trước, sau đó là câu chứa đủ các từ (không cần liền nhau, không cần đúng thứ tự).
   - Gõ có dấu thì so có dấu; gõ không dấu thì so không dấu. Dấu gạch nối coi như khoảng trắng ("công bình" tìm ra "công-bình").
   - So theo nguyên từ; riêng từ cuối cùng cho phép gõ dở (vd "Giê-hô" tìm ra "Giê-hô-va"). */
const PUNCT=/[-‐–—,.;:!?“”"'’‘()\[\]…]/g;
const plain=s=>s.normalize('NFC').toLowerCase().replace(PUNCT,' ');           // giữ dấu, độ dài không đổi
const strip=s=>s.replace(/đ/g,'d').normalize('NFD').replace(/[̀-ͯ]/g,'');  // bỏ dấu, độ dài không đổi với chuỗi NFC
function findWord(hay,w,prefix){ // tìm nguyên từ trong chuỗi đã chuẩn hóa (các từ cách nhau bằng khoảng trắng)
  let i=-1;while((i=hay.indexOf(w,i+1))>=0){if((i===0||hay[i-1]===' ')&&(prefix||i+w.length===hay.length||hay[i+w.length]===' '))return i}return -1}
function doSearch(save){
  const q=$('#sIn').value.trim();if(q.length<2){renderRecentSearch();return}
  if(!sIdx){sIdx=[];B.forEach((bk,b)=>bk[2].forEach((vs,c)=>vs.forEach((t,v)=>{if(t){const p=plain(t);sIdx.push([b,c,v,p,strip(p)])}})))}
  const pq=plain(q).replace(/\s+/g,' ').trim(), acc=strip(pq)!==pq;   // acc: người dùng có gõ dấu
  const key=acc?pq:strip(pq), words=[...new Set(key.split(' ').filter(Boolean))];
  if(!words.length){renderRecentSearch();return}
  // cụm từ: các từ liền nhau, giữa có thể là dấu câu (đã thành khoảng trắng); từ cuối cho phép gõ dở
  const phRe=new RegExp('(^| )'+key.split(' ').map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join(' +'));
  const res=[];
  for(const [b,c,v,p,n] of sIdx){
    if(scope==='ot'&&b>38||scope==='nt'&&b<39||scope==='book'&&b!==pos.b)continue;
    const hay=(acc?p:n).replace(/\s+/g,m=>' '.repeat(m.length));
    const pm=words.length>1?phRe.exec(hay):null;
    if(pm){const st=pm.index+pm[1].length;res.push([0,b,c,v,[[st,pm.index+pm[0].length]]]);continue}
    const rg=[];let ok=true;
    words.forEach((w,j)=>{if(!ok)return;const last=j===words.length-1;let i=findWord(hay,w,last);if(i<0){ok=false;return}
      while(i>=0){rg.push([i,i+w.length]);const k=hay.slice(i+1).length?findWord(hay.slice(i+1),w,last):-1;i=k<0?-1:i+1+k}});
    if(ok)res.push([1,b,c,v,rg.sort((x,y)=>x[0]-y[0])]);
  }
  res.sort((x,y)=>x[0]-y[0]);
  if(save){searches=[q,...searches.filter(x=>x!==q)].slice(0,15);store.set('searches',searches)}
  const nPh=res.filter(r=>r[0]===0).length, out=res.slice(0,300);
  $('#sBody').innerHTML=`<div class="sec">${res.length} KẾT QUẢ${words.length>1&&nPh?' · '+nPh+' CÂU CÓ ĐÚNG CỤM TỪ':''}${res.length>300?' · HIỆN 300 ĐẦU':''}</div>`+out.map(([sc,b,c,v,rg])=>{
    const t=B[b][2][c][v].normalize('NFC'),a=Math.max(0,rg[0][0]-60),z=Math.min(t.length,Math.max(rg[0][1]+100,a+160));
    let h='',pos0=a;for(const [x,y] of rg){if(x<pos0||x>=z)continue;h+=esc(t.slice(pos0,x))+'<mark>'+esc(t.slice(x,Math.min(y,z)))+'</mark>';pos0=Math.min(y,z)}
    h+=esc(t.slice(pos0,z));
    return `<button class="res" data-b="${b}" data-c="${c}" data-v="${v+1}"><b>${esc(ref(b,c,vlabel(b,c,v+1)))}</b><p>${a?'…':''}${h}${z<t.length?'…':''}</p></button>`}).join('');
}

/* ---------- Đọc thành tiếng ----------
   Trong APK: dùng giọng đọc của Android (plugin TextToSpeech). Trên trình duyệt: Web Speech. */
let tts=null;
const langRe=()=>new RegExp('^'+set.lang,'i');
function pickVoice(){return 'speechSynthesis' in window?(speechSynthesis.getVoices()||[]).find(v=>langRe().test((v.lang||'').replace('_','-'))):null}
let VOICES=null; // [{i, name, local}] giọng tiếng Việt có trên máy
function webVoices(){const all=speechSynthesis.getVoices()||[];
  return all.map((v,i)=>({i,name:v.name,lang:v.lang,local:v.localService,ref:v})).filter(v=>langRe().test((v.lang||'').replace('_','-')))}
if(!TTS&&'speechSynthesis' in window){ // Safari/Chrome nạp danh sách giọng chậm: nạp sẵn từ lúc mở app
  const warm=()=>{const v=webVoices();if(v.length){VOICES=v.sort((a,b)=>(a.local-b.local)||a.name.localeCompare(b.name))}};
  warm();try{speechSynthesis.addEventListener('voiceschanged',warm)}catch(e){speechSynthesis.onvoiceschanged=warm}}
async function loadVoices(){
  if(VOICES)return VOICES;
  try{

function mergeIn(d,usePos){ // trả về số câu thay đổi
  let n=0;const rh=d.hl||{},rt=d.tomb||{};
  const keys=new Set([...Object.keys(hl),...Object.keys(tomb),...Object.keys(rh),...Object.keys(rt)]);
  for(const k of keys){
    const cand=[[hl[k]?(hl[k].t||0):-1,'lh'],[tomb[k]!=null?tomb[k]:-1,'lt'],[rh[k]?(rh[k].t||1):-1,'rh'],[rt[k]!=null?rt[k]:-1,'rt']].sort((a,b)=>b[0]-a[0])[0];
    if(cand[1]==='rh'&&JSON.stringify(rh[k])!==JSON.stringify(hl[k])){hl[k]=Object.assign({},rh[k],{t:rh[k].t||1});delete tomb[k];n++}
    else if(cand[1]==='rt'){if(hl[k]){delete hl[k];n++}tomb[k]=rt[k]}
  }
  const old=Date.now()-180*864e5;for(const k in tomb)if(tomb[k]<old)delete tomb[k];
  const m=new Map(hist.map(h=>[h.b+'.'+h.c,h]));for(const h of d.hist||[]){const k=h.b+'.'+h.c,o=m.get(k);if(!o||h.t>o.t)m.set(k,h)}
  hist=[...m.values()].sort((a,b)=>b.t-a.t).slice(0,50);
  searches=[...new Set([...searches,...(d.searches||[])])].slice(0,15);
  store.set('hl',hl);store.set('tomb',tomb);store.set('hist',hist);store.set('searches',searches);

  return n;
}

  if(acct.idt&&Date.now()<acct.exp-60e3)return acct.idt;
  const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(acct.refresh)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error('Phiên đăng nhập hết hạn, hãy đăng nhập lại');e.auth=true;throw e}
  acct.idt=j.id_token;acct.refresh=j.refresh_token;acct.exp=Date.now()+(+j.expires_in||3600)*1000;acSave();return acct.idt;
}
const acURL=()=>'https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents/dkt/'+acct.uid; // tách khỏi users/<uid> của app Kinh Thánh 1925

function acctSoon(){if(!acOK()||!acct.uid)return;clearTimeout(acT);acT=setTimeout(()=>acctSync(false),4000)}
async function acctSync(interactive,usePos){
  if(!acOK()||!acct.uid||acBusy)return;acBusy=true;if(interactive)renderAcct('Đang đồng bộ…');
  try{
    const tk=await acToken();const H={Authorization:'Bearer '+tk};
    let r=await fetch(acURL(),{headers:H}),remote=null;
    if(r.ok){const j=await r.json();const v=j.fields&&j.fields.data&&j.fields.data.stringValue;if(v)remote=JSON.parse(v)}
    else if(r.status!==404)throw new Error('Máy chủ báo lỗi '+r.status);
    if(remote){
      /* force: vừa đăng nhập; boot: vừa mở app (vị trí trên máy bị ghi giờ lúc mở, nên so với giờ trước khi mở) */
      if(remote.pos&&(usePos==='force'||(usePos==='boot'&&(remote.pos.t||0)>pos0)))remote=Object.assign({},remote,{pos:Object.assign({},remote.pos,{t:Date.now()+1})});
      const n=mergeIn(remote,!!(usePos||interactive));if(n)refreshPages();mergePlan(remote.plan,usePos==='force')}
    const body=JSON.stringify(acPayload());
    const rb=remote?JSON.stringify({app:remote.app,ver:remote.ver,hl:remote.hl,tomb:remote.tomb,hist:remote.hist,searches:remote.searches,pos:remote.pos,plan:remote.plan}):'';
    if(body!==rb){
      r=await fetch(acURL(),{method:'PATCH',keepalive:body.length<60000,headers:Object.assign({'Content-Type':'application/json'},H),
        body:JSON.stringify({fields:{data:{stringValue:body},t:{integerValue:String(Date.now())},name:{stringValue:profName()},group:{stringValue:(PL.prof&&PL.prof.group)||''},email:{stringValue:acct.email||''}}})});
      if(!r.ok)throw new Error('Không lưu được ('+r.status+')');
    }
    acct.last=Date.now();acct.err='';if(interactive)toast('Đã đồng bộ tài khoản');
  }catch(e){
    const m=String(e&&e.message||e);
    acct.err=/Failed to fetch|NetworkError|Load failed|network/i.test(m)?'chưa đồng bộ được (mất mạng?), sẽ thử lại':m.slice(0,140);
    if(e.auth){acct.idt='';acct.refresh=''}
    if(interactive)toast(acct.err);
  }finally{acBusy=false;acSave();renderAcct();if(typeof homeOn==='function'&&homeOn()&&NCH)renderHome()}
}

/* ---------- Kế hoạch đọc, tiến độ, báo cáo (app Đọc KT Hằng Ngày) ----------
   Dữ liệu lưu ở kt.plan: {goal, start, pos (đoạn kế tiếp cần đọc, đếm toàn bộ 0..1188), log{ngày:{c:số ký tự,ch:[đoạn]}},
   plans{ngày:{from,n,q}}, rounds[{y,n,d}], speed, off (số ngày giả lập, chỉ bản web)}.
   Phần đọc mỗi ngày = (số ký tự còn phải đọc trong năm) / (số ngày còn lại), cắt ở cuối đoạn, cố định khi mở lần đầu trong ngày. */
const SaveImg=P('SaveImage');
const TEST=location.hash==='#thu'; // công cụ thử: mở link có #thu
let LEN=[],CUM=[0],NCH=0,TOTAL=0,lastCi=null;
const pdef=()=>({goal:4,start:null,pos:0,log:{},plans:{},rounds:[],speed:1200,off:0,tp:0,prof:null,yb:{}});
/* yb[năm]={r,c,t}: số liệu khai báo đã đọc trong năm TRƯỚC khi dùng app (r lần trọn + c đoạn của lần đang đọc) */ // prof: {name, group, t} hồ sơ cá nhân
let PL=Object.assign(pdef(),store.get('plan',{}));
const psave=()=>{store.set('plan',PL);if(typeof acctSoon==='function')acctSoon()};
const touch=()=>{PL.tp=Date.now()}; // giờ người dùng đổi tiến độ/mục tiêu: dùng khi gộp dữ liệu giữa các máy
const pad2=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const dparse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+(TEST?PL.off:0));return d};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const ddiff=(a,b)=>Math.round((b-a)/864e5);
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const cname=i=>{const [b,c]=chList[i];return ref(b,c)};
function initPlan(){
  LEN=chList.map(([b,c])=>VB[b][2][c].reduce((s,v)=>s+(v?v.length:0),0));
  CUM=[0];LEN.forEach((l,i)=>CUM.push(CUM[i]+l));NCH=LEN.length;TOTAL=CUM[NCH];
  if(!PL.start){PL.start=dkey(today());PL.pos=chIdx(pos.b,pos.c)===0?0:PL.pos;psave()}
}
const readIn=(y,before)=>Object.entries(PL.log).reduce((s,[k,v])=>s+((+k.slice(0,4)===y&&(!before||k<before))?v.c:0),0);
const ybOf=y=>(PL.yb||{})[y]||null;
const baseCh=y=>{const b=ybOf(y);return b?b.r*NCH+b.c:0};
const appChIn=y=>Object.entries(PL.log).reduce((s2,[k,v])=>s2+(+k.slice(0,4)===y?v.ch.length:0),0);
const yearCh=y=>baseCh(y)+appChIn(y); // tổng số đoạn đã đọc trong năm
function yearTarget(y){const yb0=ybOf(y);if(yb0)return Math.max(0,PL.goal*TOTAL-(yb0.r*TOTAL+CUM[yb0.c]));const st=dparse(PL.start),dy=ddiff(new Date(y,0,1),new Date(y+1,0,1));
  if(st.getFullYear()===y)return PL.goal*TOTAL*ddiff(st,new Date(y+1,0,1))/dy;
  return st.getFullYear()<y?PL.goal*TOTAL:0}
function makePlan(d,p0){
  const y=d.getFullYear(),k=dkey(d),left=ddiff(d,new Date(y+1,0,1));
  const q=Math.max(0,yearTarget(y)-readIn(y,k))/left;let acc=0,i=p0,n=0;
  while(n<NCH){const l=LEN[i];if(n>0&&acc+l/2>q)break;acc+=l;n++;i=(i+1)%NCH;if(q<=0)break}
  return{from:p0,n,q:acc};
}
function plan(d){const k=dkey(d);if(!PL.plans[k]){PL.plans[k]=makePlan(d,PL.pos);
  const ks=Object.keys(PL.plans).sort();if(ks.length>800)ks.slice(0,ks.length-800).forEach(x=>delete PL.plans[x]);psave()}return PL.plans[k]}
const planEnd=p=>(p.from+p.n-1)%NCH;
function dayState(k){const p=PL.plans[k],l=PL.log[k];if(!l||!l.c)return 0;return p&&l.c>=p.q-1?2:1}
function readChapter(d,paper){
  const k=dkey(d);plan(d);const before=dayState(k);
  const L=PL.log[k]||(PL.log[k]={c:0,ch:[]});const i=PL.pos;
  L.c+=LEN[i];L.ch.push(i);L.t=Date.now();if(paper)L.p=(L.p||0)+1;PL.pos=(i+1)%NCH;touch();let done=null;
  if(i===NCH-1){const y=d.getFullYear(),n=(ybOf(y)?ybOf(y).r:0)+PL.rounds.filter(r=>r.y===y).length+1;PL.rounds.push({y,n,d:k});done={y,n}}
  psave();return{done,dayDone:before<2&&dayState(k)===2};
}
function streak(){let d=today(),n=0;if(dayState(dkey(d))<2)d=addD(d,-1);while(dayState(dkey(d))===2){n++;d=addD(d,-1)}return n}
const fmtD=d=>(d.getDay()?'Thứ '+(d.getDay()+1):'Chủ nhật')+', '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
const mins=c=>Math.max(1,Math.round(c/PL.speed));
const hm=m=>m>=60?Math.floor(m/60)+' giờ'+(m%60?' '+m%60+' phút':''):m+' phút';
const todayPct=()=>{const t=today(),p=plan(t),L=PL.log[dkey(t)];return Math.min(100,Math.round((L?L.c:0)/p.q*100))};

/* Gọi mỗi khi vị trí đọc đổi: lật qua hết đoạn đang cần đọc thì ghi nhận đoạn đó */
function trackMove(){

}
function markRead(){const r=readChapter(today());

function endBible(){
  if(NCH&&PL.pos===NCH-1&&chIdx(pos.b,pos.c)===NCH-1)markRead();else toast('Đã hết Kinh Thánh');
}
function celebrate({y,n}){

function quickCount(){const t=today(),p=plan(t),end=p.from+p.n;const cur=PL.pos>=p.from?PL.pos:PL.pos+NCH;return cur<end?end-cur:0}
function paperCard(){const q=quickCount(),u=PL.undo;
  return `<div class="card"><div class="lbl">Đọc bằng Kinh Thánh sách giấy?</div>
    ${q?`<button class="hbtn alt" id="hPaperDone" style="margin-top:10px">Đã đọc xong phần hôm nay (${q} đoạn)</button>`:''}
    <button class="hbtn alt" id="hPaperRep" style="margin-top:10px">Báo cáo đã đọc đến…</button>

    showModal(`<div class="big" style="font-size:22px">Ghi nhận đã đọc xong?</div><p class="lbl" style="font-size:15px;margin:10px 0 4px">${q} đoạn: ${esc(cname(PL.pos))}${q>1?' → '+esc(cname((PL.pos+q-1)%NCH)):''}, hôm nay.</p><button class="hbtn or" data-a="ok">Đúng, ghi nhận</button><button class="hbtn" data-a="x" style="background:transparent;color:inherit;border:1px solid #ccc">Hủy</button>`,
      {ok:()=>{hideModal();paperRead(today(),q)},x:hideModal})};
  $('#hPaperRep').onclick=openPaper;const u=$('#hUndo');if(u)u.onclick=undoPaper}
function paperRead(d,n){
  const k=dkey(d),snap={pos:PL.pos,rl:PL.rounds.length,k,log:PL.log[k]?JSON.parse(JSON.stringify(PL.log[k])):null,plan:PL.plans[k]?JSON.parse(JSON.stringify(PL.plans[k])):null};
  const from=cname(PL.pos);let done=null,dd=false;
  for(let j=0;j<n;j++){const r=readChapter(d,true);if(r.done)done=r.done;if(r.dayDone)dd=true}
  const to=cname((PL.pos+NCH-1)%NCH),dl=d.getDate()+'/'+(d.getMonth()+1);
  snap.label=n+' đoạn ('+from+(n>1?' → '+to:'')+') ngày '+dl;PL.undo=snap;replanToday(k);psave();lastCi=null;
  if(done)celebrate(done);else{toast('Đã ghi nhận '+n+' đoạn đọc sách giấy, ngày '+dl+(dd?'. Đã xong phần ngày này.':''));renderHome()}
}
function undoPaper(){const u=PL.undo;if(!u)return;
  const added=PL.rounds.slice(u.rl);PL.rdel=Array.from(new Set([...(PL.rdel||[]),...added.map(x=>x.y+'-'+x.n+'-'+x.d)]));
  PL.rounds=PL.rounds.slice(0,u.rl);PL.pos=u.pos;
  PL.log[u.k]=u.log?Object.assign(u.log,{t:Date.now()}):{c:0,ch:[],t:Date.now()};
  if(u.plan)PL.plans[u.k]=u.plan;

/* báo bù ngày trước làm vị trí đọc đổi: nếu hôm nay chưa đọc gì thì tính lại phần đọc của hôm nay */

      x.lineWidth=1;x.strokeStyle='#000';x.strokeRect(ox+.5,ry+.5,NW,nr*CH);nameCell(META[b][0],ox,ry,nr*CH);
      for(let i=0;i<n;i++){const cx=ox+NW+(i%PER)*CW,cy=ry+Math.floor(i/PER)*CH,s2=st(gi+i);
        if(s2){x.fillStyle=s2==='o'?CO:CG;x.fillRect(cx,cy,CW,CH)}
        x.strokeStyle='#000';x.strokeRect(cx+.5,cy+.5,CW,CH);
        x.fillStyle='#000';x.textAlign='center';x.font=(i+1>99?'400 12px ':'400 14px ')+F;x.fillText(i+1,cx+CW/2,cy+CH/2+1)}
      gi+=n;ry+=nr*CH}};
  drawSide(0,SPLIT,M);drawSide(SPLIT,META.length,M+SW+GAP);
  /* chú thích màu */
  let lx=M;const ly=H-M-14;x.textAlign='left';x.font='400 18px '+F;
  [[CO,'Đọc hôm nay'],[CG,'Đã đọc những ngày trước'],['#fff','Chưa đọc']].forEach(([c,lb])=>{x.fillStyle=c;x.fillRect(lx,ly-11,30,22);x.strokeStyle='#000';x.lineWidth=1;x.strokeRect(lx+.5,ly-10.5,30,22);
    x.fillStyle='#000';x.fillText(lb,lx+40,ly+1);lx+=40+x.measureText(lb).width+40});
  deliverImg(cv,'DocLanThu'+curRound(y)+'_'+dkey(t)+'.png');
}

/* Ảnh báo cáo dạng sách (phương án C, David chốt 24/11/2026): 66 sách thành 2 cột, ô tên sách bo góc
   (xanh đậm: đọc xong sách, cam: sách đang đọc, tối: chưa đọc), mỗi đoạn một vòng tròn 24 đoạn/hàng
   (xanh lá: đã đọc, cam: đoạn đang đọc, chỉ viền: chưa đọc đến). Đầu ảnh: tên tài khoản và thanh tiến độ lần đọc. */
async function shareGrid(){
  try{await Promise.all(['400','500','600','700'].map(w=>document.fonts.load(w+" 20px 'Be Vietnam Pro'")))}catch(e){}
  const F="'Be Vietnam Pro',Arial,sans-serif",OR=pal()[1],GR=pal()[2],NAVY='#173042',INK='#111';
  const META=VB.map(bk=>[bk[0],bk[2].length]),t=today(),y=t.getFullYear(),pf=PL.prof||{},di=dayInfo(dkey(t));
  const PER=24,D=24,P=28,NW=158,M=24,BG=7,HEAD=196,SPLIT=24;
  const rowsOf=n=>Math.ceil(n/PER),bookH=n=>rowsOf(n)*P-(P-D);
  const sideH=(b0,b1)=>{let h=0;for(let b=b0;b<b1;b++)h+=bookH(META[b][1])+BG;return h};
  const SW=NW+12+PER*P,GAP=40,W=M*2+SW*2+GAP,H=HEAD+M+Math.max(sideH(0,SPLIT),sideH(SPLIT,META.length))+70;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.textBaseline='middle';
  const rr=(a,b2,w,h,r)=>{x.beginPath();x.moveTo(a+r,b2);x.arcTo(a+w,b2,a+w,b2+h,r);x.arcTo(a+w,b2+h,a,b2+h,r);x.arcTo(a,b2+h,a,b2,r);x.arcTo(a,b2,a+w,b2,r);x.closePath()};
  const fitF=(txt,max,fs,wt)=>{x.font=wt+' '+fs+'px '+F;while(x.measureText(txt).width>max&&fs>10){fs--;x.font=wt+' '+fs+'px '+F}return fs};
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  /* đầu ảnh: tài khoản báo cáo */
  x.fillStyle=NAVY;x.fillRect(0,0,W,HEAD);x.fillStyle='#fff';x.textAlign='left';
  fitF(pf.name||'(chưa khai tên)',W-2*M,40,'600');x.fillText(pf.name||'(chưa khai tên)',M,52);
  const now=new Date(),sub=[pf.group?'Nhóm: '+pf.group:'',acct.uid?acct.email:'chưa đăng nhập tài khoản','Báo cáo lúc '+pad2(now.getHours())+':'+pad2(now.getMinutes())+' ngày '+t.getDate()+'/'+(t.getMonth()+1)+'/'+y,'Hôm nay: '+di.txt].filter(Boolean).join(' · ');
  x.globalAlpha=.85;fitF(sub,W-2*M,22,'400');x.fillText(sub,M,96);x.globalAlpha=1;
  const v=roundPct();x.font='600 26px '+F;x.fillText('Đọc lần thứ '+curRound(y),M,146);
  const bx=M+260,bw=W-bx-340;rr(bx,134,bw,24,12);x.fillStyle='rgba(255,255,255,.18)';x.fill();
  if(v>0){rr(bx,134,Math.max(24,bw*v/100),24,12);x.fillStyle=GR;x.fill()}
  x.fillStyle=OR;x.font='700 44px '+F;x.textAlign='right';x.fillText(fmtPct(v),W-M-170,146);
  x.fillStyle='#fff';x.font='400 20px '+F;x.fillText(PL.pos+'/'+NCH+' đoạn',W-M,146);
  /* các sách */
  const st=i=>i<PL.pos?'g':i===PL.pos?'o':'';
  const circ=(cx,cy,s2,num)=>{x.beginPath();x.arc(cx,cy,D/2,0,Math.PI*2);
    if(s2){x.fillStyle=s2==='g'?GR:OR;x.fill()}else{x.lineWidth=1.5;x.strokeStyle='#9aa3ab';x.stroke()}
    x.fillStyle=s2?INK:'#6b7580';x.textAlign='center';x.font=(num>99?'500 11px ':'500 13px ')+F;x.fillText(num,cx,cy+1)};
  let gi=0;
  const side=(b0,b1,ox)=>{let yy=HEAD+M;
    for(let b=b0;b<b1;b++){const n=META[b][1],nr=rowsOf(n),h=bookH(n);let done=0;for(let i=0;i<n;i++)if(st(gi+i)==='g')done++;
      const bs=done===n?'g':(done||st(gi)==='o'||(PL.pos>gi&&PL.pos<gi+n))?'o':'';
      rr(ox,yy,NW,h,10);x.fillStyle=bs==='g'?'#1f7a3a':bs==='o'?'#c76a0e':NAVY;x.fill();
      x.fillStyle='#fff';x.textAlign='center';fitF(META[b][0],NW-14,nr>1?16:14,'600');x.fillText(META[b][0],ox+NW/2,yy+h/2-(nr>1?9:0));
      if(nr>1){x.font='400 13px '+F;x.globalAlpha=.85;x.fillText(done+'/'+n,ox+NW/2,yy+h/2+12);x.globalAlpha=1}
      for(let i=0;i<n;i++)circ(ox+NW+12+(i%PER)*P+D/2,yy+Math.floor(i/PER)*P+D/2,st(gi+i),i+1);
      yy+=h+BG;gi+=n}};
  side(0,SPLIT,M);side(SPLIT,META.length,M+SW+GAP);
  /* chú thích */
  let lx=M;const ly=H-32;x.textAlign='left';
  [[GR,'Đã đọc hết'],[OR,'Đang đọc dở'],['','Chưa đọc đến'],['#1f7a3a','Sách đã đọc xong','r'],['#c76a0e','Sách đang đọc','r'],[NAVY,'Sách chưa đọc','r']].forEach(([c,lb,r])=>{
    if(r){rr(lx,ly-11,34,22,6);x.fillStyle=c;x.fill()}else{x.beginPath();x.arc(lx+12,ly,12,0,7);if(c){x.fillStyle=c;x.fill()}else{x.lineWidth=1.5;x.strokeStyle='#9aa3ab';x.stroke()}}
    x.fillStyle=INK;x.font='400 20px '+F;x.fillText(lb,lx+(r?44:32),ly+1);lx+=x.measureText(lb).width+(r?44:32)+46});
  deliverImg(cv,'BaoCao_'+(pf.name||'').replace(/\s+/g,'')+'_'+dkey(t)+'.png');
}

/* Thẻ tài khoản: tab Kế hoạch; tab Hôm nay khi chưa đăng nhập (đặt lên đầu) */
function placeAcct(){const a=$('#rowAcct'),sc=$('#hScroll'),bd=$('#hBody');if(!a)return;
  a.style.display=htab==='acct'?'':'none';
  if(!acct.uid){if(a.nextElementSibling!==bd)sc.insertBefore(a,bd)}else if(bd.nextElementSibling!==a)sc.appendChild(a);

/* Gộp kế hoạch từ tài khoản (máy khác) vào máy này. force: vừa đăng nhập, lấy cài đặt của tài khoản */
function mergePlan(r,force){
  if(!r||typeof r!=='object')return false;let ch=false;
  for(const [k,v] of Object.entries(r.log||{})){const l=PL.log[k];if(!l||((v.t||l.t)?(v.t||0)>(l.t||0):(v.c||0)>(l.c||0))){PL.log[k]=v;ch=true}}
  for(const [k,v] of Object.entries(r.plans||{}))if(!PL.plans[k]||(force&&JSON.stringify(PL.plans[k])!==JSON.stringify(v))){PL.plans[k]=v;ch=true}
  PL.rdel=Array.from(new Set([...(PL.rdel||[]),...(r.rdel||[])]));
  for(const x of r.rounds||[])if(!PL.rounds.some(y=>y.y===x.y&&y.n===x.n)&&!PL.rdel.includes(x.y+'-'+x.n+'-'+x.d)){PL.rounds.push(x);ch=true}
  PL.rounds=PL.rounds.filter(x=>!PL.rdel.includes(x.y+'-'+x.n+'-'+x.d));
  PL.rounds.sort((a,b)=>a.d<b.d?-1:1);
  if(r.prof&&r.prof.t&&(!PL.prof||r.prof.t>(PL.prof.t||0)||force)&&JSON.stringify(r.prof)!==JSON.stringify(PL.prof)){PL.prof=r.prof;ch=true}
  for(const [yk,v] of Object.entries(r.yb||{})){PL.yb=PL.yb||{};const l=PL.yb[yk];if(!l||(v.t||0)>(l.t||0)){PL.yb[yk]=v;ch=true}}
  if((r.tp||0)>(PL.tp||0)||(force&&r.tp)){for(const f of ['goal','start','pos','speed','rc','rs','tp'])if(r[f]!==undefined&&PL[f]!==r[f]){PL[f]=r[f];ch=true}}
  if(ch){store.set('plan',PL);lastCi=null;if(homeOn())renderHome()}
  return ch;
}
